<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="goldGradient" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFF5D1"/>
      <stop offset="35%" stop-color="#E2B755"/>
      <stop offset="70%" stop-color="#C29028"/>
      <stop offset="100%" stop-color="#8C6310"/>
    </linearGradient>
    <linearGradient id="bgGradient" x1="0" y1="0" x2="0" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#141414"/>
      <stop offset="100%" stop-color="#050505"/>
    </linearGradient>
  </defs>

  <!-- Container Box -->
  <rect width="64" height="64" rx="16" fill="url(#bgGradient)" stroke="#262626" stroke-width="1.5"/>
  <rect x="2" y="2" width="60" height="60" rx="14" fill="none" stroke="url(#goldGradient)" stroke-width="0.5" stroke-opacity="0.3"/>

  <!-- Architectural Gold Z Mark -->
  <g>
    <!-- Top Horizontal Gold Bar with Cut Corner -->
    <path d="M 16 18 H 48 L 41 26 H 16 Z" fill="url(#goldGradient)"/>
    
    <!-- Sharp Diagonal Slash -->
    <path d="M 45 22 L 23 42 H 18 L 40 22 Z" fill="url(#goldGradient)"/>
    
    <!-- Bottom Horizontal Gold Bar -->
    <path d="M 16 38 L 23 46 H 48 V 38 Z" fill="url(#goldGradient)"/>
    
    <!-- Studio Accent Node -->
    <circle cx="48" cy="18" r="3.5" fill="#FFF5D1"/>
  </g>
</svg>